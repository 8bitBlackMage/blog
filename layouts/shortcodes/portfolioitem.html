<div class = "portfolioItem">
    <hr class = "break">
    <b>{{ .Get "name" | markdownify| plainify }} | {{ .Get "artist" | markdownify| plainify }}</b>
    <span class="date">{{ .Get "year" | markdownify| plainify }}</span>
    <div>
    {{- if  (.Get "spotify")}}
    <iframe data-testid="embed-iframe" style="border-radius:12px" src={{.Get "spotify"}} width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    {{end}}
    {{- if (.Get "bandcamp")}}
    <iframe style="border: 0; width: 100%; height: 152px;" src="https://bandcamp.com/EmbeddedPlayer/album=2555347176/size=large/bgcol=333333/linkcol=9a64ff/tracklist=false/artwork=small/transparent=true/"seamless><a href={{.Get "bandcamp"}}></a></iframe>
    {{end}}
    {{- if (.Get "youtube")}}
    <iframe width="300" height="200" src={{.Get "youtube"}} frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    {{end}}
    </div>
    {{.Get "work-done"}}
</div>
