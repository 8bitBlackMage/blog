baseurl: https://lilithblackmage.co.uk
languageCode: en-us
theme: hugo-theme-stack
paginate: 3
title: I'll think of a witty title later

outputs:
    home : ["HTML", "RSS"]


params:
    rssFullContent: true
    article:
      readingTime: false
    imageProcessing:
        cover:
            enabled: true
        content:
            enabled: true
    widgets:
        homepage:
            - type: search
            - type: archives
              params:
                  limit: 5
            - type: categories
              params:
                  limit: 10
            - type: tag-cloud
              params:
                  limit: 10
        page:
            - type: toc


menu:
    main: []


    social:
        - identifier: github
          name: GitHub
          url: https://github.com/8bitBlackMage
          params:
              icon: github

        - identifier: mastodon
          name: Mastodon
          url: https://toot.lgbt/@lilithblackmage
          params:
              icon: mastodon

        - identifier: instagram
          name: Instagram
          url: https://www.instagram.com/lilith_the_black_mage/
          params:
            icon: instagram

